<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 202" width="900" height="202" role="img" aria-label="Work process: Define, Design, Develop, Run">
  <style>
  .disp { font-family: 'Arial Narrow', 'Helvetica Neue', Impact, -apple-system, sans-serif; }
  .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: Menlo, Consolas, Monaco, ui-monospace, monospace; }
  .fg { fill: #F9F4EB; }
  .mut { fill: #D6D0C4; }
  .bd { fill: none; stroke: #F9F4EB; stroke-opacity: 0.28; stroke-width: 1.4; }
  .yel { fill: #FFE32E; }
  .yel-s { stroke: #FFE32E; }
  .neon { fill: #C0FF14; }
  .neon-s { stroke: #C0FF14; }
  .pink { fill: #FFD2F3; }
  .pink-s { stroke: #FFD2F3; }
  .viol { fill: #E5DAF6; }
  .viol-s { stroke: #E5DAF6; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #111111; }
    .mut { fill: #444444; }
    .bd { stroke: #111111; stroke-opacity: 0.22; }
    .yel { fill: #B45309; }
    .yel-s { stroke: #D97706; }
    .neon { fill: #3F6212; }
    .neon-s { stroke: #65A30D; }
    .pink { fill: #BE185D; }
    .pink-s { stroke: #DB2777; }
    .viol { fill: #6D28D9; }
    .viol-s { stroke: #7C3AED; }
  }

  .dash { stroke-dasharray: 5 6; animation: p25-pr-fl 1.2s linear infinite; }
  @keyframes p25-pr-fl { to { stroke-dashoffset: -11; } }

  /* Synchronized 8s loop matching the 8s animateMotion dot */
  .n1 { animation: p25-n1 8s ease-in-out infinite; }
  @keyframes p25-n1 {
    0%, 22% { stroke-opacity: 1; stroke-width: 2.4; }
    28%, 100% { stroke-opacity: 0.28; stroke-width: 1.4; }
  }
  .n2 { animation: p25-n2 8s ease-in-out infinite; }
  @keyframes p25-n2 {
    0%, 22% { stroke-opacity: 0.28; stroke-width: 1.4; }
    25%, 47% { stroke-opacity: 1; stroke-width: 2.4; }
    53%, 100% { stroke-opacity: 0.28; stroke-width: 1.4; }
  }
  .n3 { animation: p25-n3 8s ease-in-out infinite; }
  @keyframes p25-n3 {
    0%, 47% { stroke-opacity: 0.28; stroke-width: 1.4; }
    50%, 72% { stroke-opacity: 1; stroke-width: 2.4; }
    78%, 100% { stroke-opacity: 0.28; stroke-width: 1.4; }
  }
  .n4 { animation: p25-n4 8s ease-in-out infinite; }
  @keyframes p25-n4 {
    0%, 72% { stroke-opacity: 0.28; stroke-width: 1.4; }
    75%, 97% { stroke-opacity: 1; stroke-width: 2.4; }
    100% { stroke-opacity: 0.28; stroke-width: 1.4; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  <!-- Hidden signal track for travelling dot -->
  <path id="p25-proc-track" d="M 101 174 L 797 174" fill="none" stroke="none"/>

  <rect x="4" y="20" width="194" height="132" rx="20" fill="none" class="yel-s n1"/>
  <text x="24" y="54" font-size="12.5" font-weight="600" class="mono yel">STEP 01</text>
  <text x="24" y="90" font-size="19" font-weight="700" class="disp fg">DEFINE</text>
  <text x="24" y="118" font-size="13" class="body mut">Scope problem &amp; goals</text>

  <line class="dash yel-s" x1="204" y1="86" x2="230" y2="86" stroke-width="2" stroke-linecap="round"/>

  <rect x="236" y="20" width="194" height="132" rx="20" fill="none" class="pink-s n2"/>
  <text x="256" y="54" font-size="12.5" font-weight="600" class="mono pink">STEP 02</text>
  <text x="256" y="90" font-size="19" font-weight="700" class="disp fg">DESIGN</text>
  <text x="256" y="118" font-size="13" class="body mut">Tokens, motion &amp; UX</text>

  <line class="dash pink-s" x1="436" y1="86" x2="462" y2="86" stroke-width="2" stroke-linecap="round"/>

  <rect x="468" y="20" width="194" height="132" rx="20" fill="none" class="viol-s n3"/>
  <text x="488" y="54" font-size="12.5" font-weight="600" class="mono viol">STEP 03</text>
  <text x="488" y="90" font-size="19" font-weight="700" class="disp fg">DEVELOP</text>
  <text x="488" y="118" font-size="13" class="body mut">Clean markup &amp; APIs</text>

  <line class="dash viol-s" x1="668" y1="86" x2="694" y2="86" stroke-width="2" stroke-linecap="round"/>

  <rect x="700" y="20" width="194" height="132" rx="20" fill="none" class="neon-s n4"/>
  <text x="720" y="54" font-size="12.5" font-weight="600" class="mono neon">STEP 04</text>
  <text x="720" y="90" font-size="19" font-weight="700" class="disp fg">RUN</text>
  <text x="720" y="118" font-size="13" class="body mut">Ship &amp; iterate on Vercel</text>

  <!-- Synchronized signal bus -->
  <line x1="101" y1="174" x2="797" y2="174" class="bd" stroke-dasharray="3 6"/>
  <circle cx="101" cy="174" r="3" class="yel"/>
  <circle cx="333" cy="174" r="3" class="pink"/>
  <circle cx="565" cy="174" r="3" class="viol"/>
  <circle cx="797" cy="174" r="3" class="neon"/>
  <circle r="5" class="neon">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath href="#p25-proc-track"/>
    </animateMotion>
  </circle>
</svg>
