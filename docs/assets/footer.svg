<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 124" width="900" height="124" role="img" aria-label="Define. Design. Develop. Run.">
  <style>
  .disp { font-family: 'Arial Narrow', 'Helvetica Neue', Impact, -apple-system, sans-serif; }
  .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: Menlo, Consolas, Monaco, ui-monospace, monospace; }
  .fg { fill: #F9F4EB; }
  .mut { fill: #D6D0C4; }
  .bd { fill: none; stroke: #F9F4EB; stroke-opacity: 0.35; stroke-width: 1.4; }
  .yel { fill: #FFE32E; }
  .yel-s { stroke: #FFE32E; }
  .neon { fill: #C0FF14; }
  .neon-s { stroke: #C0FF14; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #111111; }
    .mut { fill: #444444; }
    .bd { stroke: #111111; stroke-opacity: 0.28; }
    .yel { fill: #B45309; }
    .yel-s { stroke: #D97706; }
    .neon { fill: #3F6212; }
    .neon-s { stroke: #65A30D; }
  }

  .wave { stroke-dasharray: 10 7; animation: p25-ft-wv 3s linear infinite; }
  @keyframes p25-ft-wv { to { stroke-dashoffset: -34; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
  <path id="p25-ft-wave" d="M250 22 Q 270 12 290 22 T 330 22 T 370 22 T 410 22 T 450 22 T 490 22 T 530 22 T 570 22 T 610 22 T 650 22" fill="none" class="yel-s wave" stroke-width="2" stroke-linecap="round"/>
  <circle r="4" class="neon">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#p25-ft-wave"/>
    </animateMotion>
  </circle>
  <text x="450" y="72" text-anchor="middle" font-size="36" font-weight="700" letter-spacing="-1" class="disp fg">DEFINE. DESIGN. DEVELOP. RUN.</text>
  <text x="450" y="102" text-anchor="middle" font-size="14" class="body mut">Multi-page portfolio deployed on Vercel with Node.js contact API.</text>
</svg>
