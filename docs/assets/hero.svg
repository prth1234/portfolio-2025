<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 282" width="900" height="282" role="img" aria-label="Parth Singh Portfolio 2025">
  <style>
  .disp { font-family: 'Arial Narrow', 'Helvetica Neue', Impact, -apple-system, sans-serif; }
  .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: Menlo, Consolas, Monaco, ui-monospace, monospace; }
  .fg { fill: #F9F4EB; }
  .mut { fill: #D6D0C4; }
  .bd { fill: none; stroke: #F9F4EB; stroke-opacity: 0.32; stroke-width: 1.4; }
  .yel { fill: #FFE32E; }
  .yel-s { stroke: #FFE32E; }
  .neon { fill: #C0FF14; }
  .neon-s { stroke: #C0FF14; }
  .pink { fill: #FFD2F3; }
  .pink-s { stroke: #FFD2F3; }
  .viol { fill: #E5DAF6; }
  .viol-s { stroke: #E5DAF6; }
  @media (prefers-color-scheme: light) {
    .fg { fill: #111111; }
    .mut { fill: #444444; }
    .bd { stroke: #111111; stroke-opacity: 0.25; }
    .yel { fill: #B45309; }
    .yel-s { stroke: #D97706; }
    .neon { fill: #3F6212; }
    .neon-s { stroke: #65A30D; }
    .pink { fill: #BE185D; }
    .pink-s { stroke: #DB2777; }
    .viol { fill: #6D28D9; }
    .viol-s { stroke: #7C3AED; }
  }

  .wave { stroke-dasharray: 12 8; animation: p25-wv 3s linear infinite; }
  @keyframes p25-wv { to { stroke-dashoffset: -40; } }

  .dot-ping { animation: p25-ping 2.2s ease-out infinite; transform-origin: 318px 34px; }
  @keyframes p25-ping {
    0% { r: 4; opacity: 0.9; }
    70% { r: 10; opacity: 0; }
    100% { r: 10; opacity: 0; }
  }

  .cur { animation: p25-cur 1.1s steps(2, start) infinite; }
  @keyframes p25-cur { to { opacity: 0; } }

  .tl { opacity: 0; animation: p25-tl 9.6s infinite both; }
  @keyframes p25-tl {
    0% { opacity: 0; transform: translateY(5px); }
    6% { opacity: 1; transform: translateY(0); }
    28% { opacity: 1; transform: translateY(0); }
    34% { opacity: 0; transform: translateY(-5px); }
    100% { opacity: 0; }
  }

  .pill { animation: p25-pill 4s ease-in-out infinite; }
  @keyframes p25-pill {
    0%, 100% { stroke-opacity: 0.35; stroke-width: 1.4; }
    20% { stroke-opacity: 1; stroke-width: 2.2; }
    45% { stroke-opacity: 0.35; stroke-width: 1.4; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .tl-first { opacity: 1 !important; }
  }
</style>

  <!-- Live status badge -->
  <circle cx="318" cy="34" r="4" class="neon"/>
  <circle cx="318" cy="34" r="4" fill="none" class="neon-s dot-ping" stroke-width="1.5"/>
  <text x="332" y="39" font-size="13" font-weight="600" letter-spacing="2" class="mono yel">LIVE // PORTFOLIO 2025</text>
  <text x="582" y="39" font-size="14" font-weight="700" class="mono neon cur">_</text>

  <!-- Main Title -->
  <text x="450" y="102" text-anchor="middle" font-size="56" font-weight="700" letter-spacing="-1.5" class="disp fg">PARTH SINGH — 2025</text>

  <!-- Cycling Taglines -->
  <text x="450" y="140" text-anchor="middle" font-size="17" font-weight="500" class="body mut tl tl-first" style="animation-delay:0s">Software Engineer at Flexera GCC — Cloud, FinOps &amp; Agentic AI</text>
  <text x="450" y="140" text-anchor="middle" font-size="17" font-weight="500" class="body yel tl" style="animation-delay:3.2s">4 Interactive Routes: About, Experience, Projects &amp; More</text>
  <text x="450" y="140" text-anchor="middle" font-size="17" font-weight="500" class="body pink tl" style="animation-delay:6.4s">Scroll-Driven Storytelling + Live Nodemailer Contact API</text>

  <!-- Animated Wave + Travelling Signal Dot -->
  <path id="p25-hero-wave" d="M180 176 Q 202 164 225 176 T 270 176 T 315 176 T 360 176 T 405 176 T 450 176 T 495 176 T 540 176 T 585 176 T 630 176 T 675 176 T 720 176" fill="none" class="yel-s wave" stroke-width="2.2" stroke-linecap="round"/>
  <circle r="4.5" class="neon">
    <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#p25-hero-wave"/>
    </animateMotion>
  </circle>

  <!-- Sequential Highlight Pills -->
  <rect x="136" y="216" width="142" height="34" rx="17" fill="none" class="yel-s pill" style="animation-delay:0s"/>
  <text x="207" y="238" text-anchor="middle" font-size="13" font-weight="600" class="mono yel">HTML5 + CSS3</text>

  <rect x="292" y="216" width="150" height="34" rx="17" fill="none" class="pink-s pill" style="animation-delay:1s"/>
  <text x="367" y="238" text-anchor="middle" font-size="13" font-weight="600" class="mono pink">VANILLA JS</text>

  <rect x="456" y="216" width="174" height="34" rx="17" fill="none" class="viol-s pill" style="animation-delay:2s"/>
  <text x="543" y="238" text-anchor="middle" font-size="13" font-weight="600" class="mono viol">NODE + NODEMAILER</text>

  <rect x="644" y="216" width="120" height="34" rx="17" fill="none" class="neon-s pill" style="animation-delay:3s"/>
  <text x="704" y="238" text-anchor="middle" font-size="13" font-weight="600" class="mono neon">VERCEL</text>
</svg>
