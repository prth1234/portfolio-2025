  }
  
  .wave { stroke-dasharray: 12 8; animation: p25-wv 3s linear infinite; }
  @keyframes p25-wv { to { stroke-dashoffset: -40; } }
  
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
